version: '3.8'

services:
  nuxt:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_USE_APP_LOGO: ${NUXT_PUBLIC_USE_APP_LOGO:-false}
        NUXT_PUBLIC_BRAND_NAME: ${NUXT_PUBLIC_BRAND_NAME:-}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - NUXT_PUBLIC_USE_APP_LOGO=${NUXT_PUBLIC_USE_APP_LOGO:-false}
      - NUXT_PUBLIC_BRAND_NAME=${NUXT_PUBLIC_BRAND_NAME:-}
    restart: unless-stopped
